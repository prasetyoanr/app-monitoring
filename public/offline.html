<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#004d32" />
    <title>No Connection | GA Management</title>
    <style>
      * { box-sizing: border-box; }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 1.5rem;
        background: #f4f6ff;
        color: #172033;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(100%, 28rem);
        padding: 2rem;
        border: 1px solid #dfe5f2;
        border-radius: 1.25rem;
        background: #fff;
        box-shadow: 0 20px 60px rgba(30, 41, 59, 0.12);
        text-align: center;
      }
      .mark {
        display: grid;
        width: 3rem;
        height: 3rem;
        margin: 0 auto 1rem;
        place-items: center;
        border-radius: 0.9rem;
        background: #004d32;
        color: #fff;
        font-weight: 800;
      }
      h1 { margin: 0; font-size: 1.25rem; }
      p { margin: 0.75rem 0 1.5rem; color: #64748b; font-size: 0.875rem; line-height: 1.6; }
      button {
        width: 100%;
        min-height: 2.75rem;
        border: 0;
        border-radius: 0.75rem;
        background: #004d32;
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 700;
      }
      button:focus-visible { outline: 3px solid rgba(0, 77, 50, 0.3); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">GA</div>
      <h1>No connection</h1>
      <p>Operational data is not stored offline. Connect your device to the internet to open GA Management again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
